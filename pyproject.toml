[project]
name = "Parallel-Classification-Test-Environment"
version = "0.1.0"
description = "Experiment Framework for Parallel Classification"
authors = [{ name = "Maximilian Bantle" }]
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "psutil",
    "torch",
    "thundersvm",
    "pyyaml",
    "typing-extensions",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

run_name: small_method_comparison
output_dir: results
repetitions: 3
enable_gpu_monitoring: true
continue_on_error: true

algorithms:
  - name: BaselineSVC
    allowed_scenarios: [cpu_sequential]
  - name: CascadeSVC
    allowed_scenarios: [cpu_sequential]
  - name: ThunderSVC
    allowed_scenarios: [gpu_single]
  - name: BaselineMLP
    allowed_scenarios: [cpu_sequential]
  - name: DualPipeClassifier
    allowed_scenarios: [gpu_single]
    parameters:
      num_chunks: 8
  - name: FSDPMLP
    allowed_scenarios: [gpu_single]
    parameters:
      use_fsdp: true
  - name: BaselineRF
    allowed_scenarios: [cpu_sequential]
  - name: HybridRF
    allowed_scenarios: [cpu_parallel]
  - name: BaselineKNN
    allowed_scenarios: [cpu_sequential]
  - name: CuMLKNN
    allowed_scenarios: [gpu_single]

datasets:
  - name: breast_cancer_csv
    loader: breast_cancer_csv
    parameters:
      test_size: 0.25
      random_state: 42

scenarios:
  - name: cpu_sequential
    description: Sequential CPU reference run.
    parameters:
      device: cpu
      n_workers: 1
  - name: cpu_parallel
    description: CPU-parallel run for multiprocessing-based methods.
    parameters:
      device: cpu
      n_workers: 4
  - name: gpu_single
    description: Single-GPU run.
    parameters:
      device: cuda
      n_workers: 1

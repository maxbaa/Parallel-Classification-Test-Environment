run_name: scientific_method_comparison
output_dir: results
repetitions: 1
enable_gpu_monitoring: true
continue_on_error: true

algorithms:
  - name: BaselineSVC
    allowed_scenarios: [cpu_sequential]
    allowed_datasets: [breast_cancer_csv, covtype_csv]
  - name: CascadeSVC
    allowed_scenarios: [cpu_sequential]
    allowed_datasets: [breast_cancer_csv, covtype_csv]
  - name: ThunderSVC
    allowed_scenarios: [gpu_single]
    allowed_datasets: [breast_cancer_csv, covtype_csv]
  - name: BaselineMLP
    allowed_scenarios: [gpu_single]
    parameters:
      batch_size: 4096
      max_iter: 50
  - name: DualPipeClassifier
    allowed_scenarios: [gpu_multi_2x]
    parameters:
      batch_size: 4096
      max_iter: 50
      num_chunks: 8
  - name: FSDPMLP
    allowed_scenarios: [gpu_multi_2x]
    parameters:
      batch_size: 4096
      max_iter: 50
      use_fsdp: true
  - name: BaselineRF
    allowed_scenarios: [cpu_sequential]
  - name: HybridRF
    allowed_scenarios: [cpu_parallel]
  - name: BaselineKNN
    allowed_scenarios: [cpu_sequential]
  - name: CuMLKNN
    allowed_scenarios: [gpu_single]
  - name: CuMLMultiGPUKNN
    allowed_scenarios: [gpu_multi_2x]
    allowed_datasets: [covtype_csv, airline_csv, higgs_csv]
    parameters:
      n_workers: 2
      chunk_size: 250000

datasets:
  - name: breast_cancer_csv
    loader: breast_cancer_csv
  - name: covtype_csv
    loader: covtype_csv
  - name: airline_csv
    loader: airline_csv
    parameters:
      n_rows: 3000000
  - name: higgs_csv
    loader: higgs_csv
    parameters:
      n_rows: 5000000

scenarios:
  - name: cpu_sequential
    description: Sequential CPU reference run.
    parameters:
      device: cpu
      n_workers: 1
  - name: cpu_parallel
    description: CPU-parallel run for methods with explicit multiprocessing.
    parameters:
      device: cpu
      n_workers: 4
  - name: gpu_single
    description: Single-GPU run on the server.
    parameters:
      device: cuda
      n_workers: 1
  - name: gpu_multi_2x
    description: Two-GPU run using both server GPUs.
    parameters:
      device: cuda
      n_workers: 2

services:
  core:
    build:
      context: .
      dockerfile: docker/core/Dockerfile
    working_dir: /workspace/Parallel-Classification-Test-Environment
    volumes:
      - ./:/workspace/Parallel-Classification-Test-Environment
    tty: true
    stdin_open: true

  rapids:
    build:
      context: .
      dockerfile: docker/rapids/Dockerfile
      args:
        RAPIDS_BASE_IMAGE: ${RAPIDS_BASE_IMAGE:-rapidsai/base:25.04-cuda12.8-py3.11}
    working_dir: /workspace/Parallel-Classification-Test-Environment
    volumes:
      - ./:/workspace/Parallel-Classification-Test-Environment
    tty: true
    stdin_open: true

  thunder:
    build:
      context: .
      dockerfile: docker/thunder/Dockerfile
      args:
        THUNDER_BASE_IMAGE: ${THUNDER_BASE_IMAGE:-nvidia/cuda:12.4.1-devel-ubuntu22.04}
    working_dir: /workspace/Parallel-Classification-Test-Environment
    volumes:
      - ./:/workspace/Parallel-Classification-Test-Environment
    tty: true
    stdin_open: true
